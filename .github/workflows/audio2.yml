name: Generate TTS Audio2

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push files back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
#          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run TTS Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate2

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      - name: Convert RAW to MP3
        run: |
          # Loop through all .raw files in audio2/
          for file in audio2/*.raw; do
            # Convert: s16le (16-bit), 24k rate, 1 channel (mono)
            ffmpeg -f s16le -ar 24000 -ac 1 -i "$file" "${file%.raw}.mp3"
            # Optional: remove the raw file to keep the repo clean
            rm "$file"
          done

      - name: Commit and Push MP3
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add audio2/*.mp3
          git commit -m "chore: add generated lao audio" || echo "No changes to commit"
          git push
